name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，如 v1.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: 打包 exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "紫金URP自动评估"
          --collect-all ddddocr
          --collect-all onnxruntime
          --collect-all cv2
          --collect-all PIL
          urp_auto.py

      - name: 压缩为 zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/紫金URP自动评估.exe" -DestinationPath "NJUST-ZJ-URP-Auto-Evaluation.zip" -CompressionLevel Optimal
          Get-Item "NJUST-ZJ-URP-Auto-Evaluation.zip" | Select-Object Name, Length

      - name: 创建或更新 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          $notes = ".github/release-notes/$env:VERSION.md"
          if (-not (Test-Path $notes)) { throw "缺少 release notes: $notes" }
          gh release view $env:VERSION --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:VERSION "NJUST-ZJ-URP-Auto-Evaluation.zip" --clobber
          } else {
            gh release create $env:VERSION "NJUST-ZJ-URP-Auto-Evaluation.zip" `
              --title "$env:VERSION 紫金URP自动评估" `
              --notes-file $notes `
              --target "${{ github.sha }}"
          }
